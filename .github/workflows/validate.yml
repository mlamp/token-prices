name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python3 scripts/validate.py
      - run: python3 scripts/update_readme.py --check
      - run: python3 -m unittest discover -s tests
      - run: git diff --check
