name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New stable version (vMAJOR.MINOR.PATCH)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check current catalog and documentation
        run: |
          python3 scripts/validate.py
          python3 scripts/update_readme.py --check
          python3 -m unittest discover -s tests
      - name: Prepare release links and schema version
        run: |
          python3 scripts/prepare_release.py "$RELEASE_VERSION"
          python3 scripts/update_readme.py --check
          python3 scripts/validate.py
          git diff --check
      - name: Commit metadata and push main and tag together
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md release.json
          git commit -m "Release $RELEASE_VERSION"
          git tag -a "$RELEASE_VERSION" -m "Release $RELEASE_VERSION"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$RELEASE_VERSION"
      - name: Publish release
        run: gh release create "$RELEASE_VERSION" --verify-tag --generate-notes --latest
